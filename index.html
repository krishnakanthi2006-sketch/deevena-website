  <style>
    *{
      margin:0;

    }

    body{

    /* HERO SECTION */

    .hero{
      width:100%;
      height:100vh;
      background:
      linear-gradient(rgba(0,0,0,0.45),rgba(0,0,0,0.45)),
      url("Popup.png");
      background-size:cover;
      background-position:center;
      display:flex;
      justify-content:center;
      align-items:center;
      text-align:center;
      color:white;
      animation:zoom 1.5s ease;
    }

    @keyframes zoom{
      from{
        transform:scale(1.08);
        opacity:0;
      }
      to{
        transform:scale(1);
        opacity:1;
      }
    }

    .hero-content{
      max-width:900px;
      padding:20px;
    }

    .hero h1{
      font-size:70px;
      font-family:'Playfair Display',serif;
      letter-spacing:2px;
      margin-bottom:20px;
      animation:slideDown 1.2s ease;
    }

    .hero p{
      font-size:20px;
      margin-bottom:35px;
      line-height:1.7;
      animation:fadeIn 2s ease;
    }

    @keyframes slideDown{
      from{
        transform:translateY(-50px);
        opacity:0;
      }
      to{
        transform:translateY(0);
        opacity:1;
      }
    }

    @keyframes fadeIn{
      from{
        opacity:0;
      }
      to{
        opacity:1;
      }
    }

    /* SERVICE BUTTONS */

    .services{
      display:flex;
      justify-content:center;
      flex-wrap:wrap;
      gap:20px;
    }

    .services a{
      text-decoration:none;
      background:#6d071a;
      color:#fff;
      padding:15px 35px;
      border-radius:40px;
      font-size:18px;
      transition:0.4s;
      border:2px solid transparent;
    }

    .services a:hover{
      background:transparent;
      border:2px solid #fff;
      transform:translateY(-5px);
    }

    /* CONTACT SECTION */

    .contact{
      padding:70px 20px;
      background:#fff7f0;
      text-align:center;
    }

    .contact h2{
      font-size:42px;
      color:#6d071a;
      margin-bottom:20px;
      font-family:'Playfair Display',serif;

      color:#444;

}

.instagram-btn:hover{
